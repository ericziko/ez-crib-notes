apiVersion: v2
name: myapp
description: A simple web application Helm chart with ingress support
type: application
version: 2.0.0
appVersion: "2.0.0"
home: https://github.com/example/myapp
sources:
  - https://github.com/example/myapp
keywords:
  - web
  - application
  - sample
  - kubernetes
author: DevOps Team
maintainers:
  - name: DevOps Team
    email: devops@example.com
dependencies:
  - name: postgresql
    version: "13.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
