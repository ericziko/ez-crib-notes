apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp.fullname" . }}-config
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
data:
  app.config: |
    server:
      port: {{ .Values.service.targetPort }}
      version: {{ .Chart.Version }}
      release: {{ .Release.Name }}
    database:
      host: {{ .Values.env | first | .value }}
      name: {{ .Chart.Name }}_db
    logging:
      level: INFO
  environment.sh: |
    #!/bin/bash
    export APP_NAME="{{ include "myapp.fullname" . }}"
    export APP_VERSION="{{ .Chart.AppVersion }}"
    export REPLICA_COUNT="{{ .Values.replicaCount }}"
