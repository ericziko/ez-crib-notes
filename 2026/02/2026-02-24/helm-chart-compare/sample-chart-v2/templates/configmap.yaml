apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp.fullname" . }}-config
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
data:
  app.config: |
    server:
      port: {{ .Values.service.targetPort }}
      version: {{ .Chart.Version }}
      release: {{ .Release.Name }}
      environment: production
    database:
      host: postgresql
      name: {{ .Chart.Name }}_db
      version: 13
    cache:
      host: redis
      port: 6379
    logging:
      level: DEBUG
  environment.sh: |
    #!/bin/bash
    export APP_NAME="{{ include "myapp.fullname" . }}"
    export APP_VERSION="{{ .Chart.AppVersion }}"
    export REPLICA_COUNT="{{ .Values.replicaCount }}"
    export ENVIRONMENT="production"
    export CACHE_ENABLED="true"
