version: '3.8'
services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "TestPassword123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost",
              "-U", "sa", "-P", "TestPassword123!", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/api/" ]
      interval: 10s
      timeout: 5s
      retries: 5
